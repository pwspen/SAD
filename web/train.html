<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SAD Demo</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --panel-soft: #fafaf8;
        --canvas-bg: #f1f1ec;
        --line: #e6e6df;
        --line-soft: #eeeeea;
        --text: #1d1d1f;
        --text-dim: #66666e;
        --text-soft: #9a9aa2;
        --accent: #ff7d33;
        --accent-hover: #ff9054;
        --accent-contrast: #ffffff;
        --accent-soft: #fff2ea;
        --focus: rgba(255, 125, 51, 0.28);
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: "Inter", "SF Pro Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
      }
      body { display: flex; flex-direction: column; }

      .top {
        flex: none;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .brand {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
        margin-right: 4px;
      }
      .brand small { font-weight: 400; color: var(--text-dim); margin-left: 6px; }
      .spacer { flex: 1 1 auto; }

      .field, .btn, .file-btn {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel-soft);
        color: var(--text);
        cursor: pointer;
        transition: background 120ms, border-color 120ms, color 120ms;
      }
      .field { cursor: text; }
      .btn:hover, .file-btn:hover, .field:hover { background: #ffffff; border-color: #d5d5ce; }
      .btn[disabled], .file-btn[disabled] { opacity: 0.45; cursor: not-allowed; }

      .btn-primary {
        background: var(--accent);
        color: var(--accent-contrast);
        border-color: var(--accent);
        font-weight: 600;
      }
      .btn-primary:hover:not([disabled]) {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .btn-primary[disabled] {
        background: #f4d6c3;
        color: #c08a64;
        border-color: #f4d6c3;
      }
      .btn-ghost { background: transparent; }
      .loop-toggle {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--text-dim);
        cursor: pointer;
        user-select: none;
      }
      .loop-toggle input { margin: 0; accent-color: var(--accent); cursor: pointer; }
      .file-btn input { display: none; }

      .kodak-nav { display: flex; gap: 4px; }
      .kodak-nav .btn { padding: 6px 10px; }
      .kodak-nav select { cursor: pointer; }

      .save-menu {
        position: relative;
      }
      .save-popover {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        min-width: 160px;
        padding: 4px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .save-popover.hidden { display: none; }
      .save-opt {
        font: inherit;
        font-size: 12px;
        text-align: left;
        padding: 7px 12px;
        border: none;
        background: transparent;
        color: var(--text);
        border-radius: 6px;
        cursor: pointer;
      }
      .save-opt:hover { background: var(--accent-soft); }

      .status-chip {
        font-size: 11px;
        color: var(--text-dim);
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--panel-soft);
        border: 1px solid var(--line-soft);
      }

      .main {
        flex: 1;
        min-height: 0;
        display: flex;
      }

      .panel {
        flex: none;
        width: 320px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        overflow-y: auto;
        padding: 16px 16px 24px;
      }
      .panel.hidden { display: none; }
      .panel h3 {
        margin: 14px 0 6px;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-soft);
        font-weight: 500;
      }
      .panel h3:first-child { margin-top: 0; }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 5px 0;
      }
      .row label {
        font-size: 12px;
        color: var(--text-dim);
        flex: 1;
        min-width: 0;
      }
      .row input[type="number"], .row input[type="text"], .row select {
        width: 110px;
        font: inherit;
        font-size: 12px;
        padding: 5px 8px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        border-radius: 6px;
        text-align: right;
      }
      .row select { text-align: left; }
      .row input[type="number"]:focus, .row input[type="text"]:focus, .row select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--focus);
      }
      .row input[type="checkbox"] { accent-color: var(--accent); }
      .file-inline {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .file-inline .file-btn { padding: 4px 8px; font-size: 11px; }
      .file-name { font-size: 11px; color: var(--text-soft); }

      /* Viewer area */
      .view {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }
      .view-toolbar {
        flex: none;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 12px;
      }
      .view-toolbar select {
        font: inherit;
        font-size: 12px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        background: var(--panel-soft);
        color: var(--text);
        border-radius: 6px;
      }
      .view-toolbar select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--focus);
      }
      .view-toolbar .btn { padding: 5px 10px; }
      .layout-edit-tools { display: flex; gap: 6px; }
      .layout-edit-tools.hidden { display: none; }
      .metric-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-left: auto;
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
      }
      .metric-row strong { color: var(--text); font-weight: 600; }

      /* Cards are generated by train.js from the active layout (LAYOUTS),
         which sets these grid variables and each card's --view. */
      .canvases {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-areas: var(--layout-areas);
        grid-template-columns: var(--layout-cols);
        grid-template-rows: var(--layout-rows);
        gap: 12px;
        padding: 12px;
        overflow: auto;
      }
      .canvas-card {
        grid-area: var(--view);
        position: relative;
        min-width: 0;
        min-height: 0;
        background: var(--canvas-bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .canvas-card canvas {
        width: auto;
        height: auto;
        max-width: none;
        max-height: none;
        image-rendering: pixelated;
        display: block;
        flex: none;
      }
      .canvas-card .overlay-canvas {
        position: absolute;
        pointer-events: none;
        /* Centroid dots toggle on/off every second so the render underneath is visible. */
        animation: overlay-blink 2s step-end infinite;
      }
      @keyframes overlay-blink {
        50% { visibility: hidden; }
      }
      .canvas-card.plot canvas {
        width: 100%;
        height: 100%;
        image-rendering: auto;
      }
      .canvas-card.hoverable canvas { cursor: crosshair; }

      /* Layout edit mode (train.js: attachEditControls / emptyCell). */
      .canvases.editing .card-label {
        cursor: grab;
        max-width: calc(100% - 56px); /* clear the remove button */
        overflow: hidden;
        white-space: nowrap;
      }
      .canvases.drag-active .canvas-card *,
      .canvases.drag-active .empty-cell * { pointer-events: none; }
      .canvas-card.dragging { opacity: 0.45; }
      .drop-ok { outline: 2px solid var(--accent); outline-offset: -2px; }
      .drop-bad { outline: 2px solid #c0392b; outline-offset: -2px; }
      .card-remove {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        padding: 0;
        font: inherit;
        font-size: 15px;
        line-height: 1;
        color: var(--text-dim);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      .card-remove:hover { color: var(--text); border-color: #d5d5ce; }
      .empty-cell {
        min-width: 0;
        min-height: 0;
        border: 1px dashed #c9c9c1;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: var(--text-soft);
      }
      .empty-cell select {
        font: inherit;
        font-size: 12px;
        max-width: calc(100% - 16px);
        padding: 5px 8px;
        border: 1px solid var(--line);
        background: var(--panel-soft);
        color: var(--text);
        border-radius: 6px;
        cursor: pointer;
      }
      /* Viewer-computed cards get a dashed edge so they never read as model output. */
      .canvas-card[data-source="derived"] {
        border-style: dashed;
        border-color: #c9c9c1;
      }
      .card-label {
        position: absolute;
        top: 10px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: help;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-dim);
        background: rgba(255, 255, 255, 0.82);
        padding: 3px 8px;
        border-radius: 4px;
        backdrop-filter: blur(6px);
        border: 1px solid var(--line-soft);
      }
      /* Where a card's data comes from (SOURCES in train.js); the label's
         tooltip spells it out. */
      .source-badge {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1;
        padding: 2px 5px;
        border-radius: 3px;
        border: 1px solid currentColor;
        white-space: nowrap;
        flex: none;
      }
      [data-source="model"] .source-badge { background: var(--text); border-color: var(--text); color: #ffffff; }
      [data-source="train"] .source-badge { color: #1c5cab; }
      [data-source="input"] .source-badge { color: var(--text-dim); }
      [data-source="derived"] .source-badge { color: var(--text-dim); border-style: dashed; }

      .footer {
        flex: none;
        padding: 10px 16px 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .progress {
        height: 4px;
        width: 100%;
        background: var(--canvas-bg);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 100ms linear;
      }
      .progress-text {
        font-size: 11px;
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
      }
      .log {
        height: 90px;
        overflow-y: auto;
        font-size: 10.5px;
        line-height: 1.5;
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        color: var(--text-dim);
        background: #fbfbf8;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        padding: 6px 10px;
        white-space: pre;
      }

      @media (max-width: 820px) {
        html, body { overflow: auto; }
        .main { min-height: 720px; }
        /* Phones ignore the layout and stack its cards. */
        .canvases {
          grid-template-areas: none;
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: none;
          align-content: start;
        }
        .empty-cell { grid-row: auto !important; grid-column: auto !important; }
        .canvas-card, .empty-cell {
          grid-area: auto;
          height: min(calc(100vw - 24px), 520px);
        }
        .canvas-card.plot {
          height: 360px;
        }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="brand">SAD Demo</div>

      <label class="file-btn">
        <input id="imageInput" type="file" accept="image/*" />
        <span id="imageLabel">Choose target image</span>
      </label>

      <div class="kodak-nav" title="Kodak targets (← / → to flick)">
        <button class="btn" id="kodakPrev" aria-label="Previous Kodak image">‹</button>
        <select class="field" id="kodakSelect" aria-label="Kodak image">
          <option value="">Kodak…</option>
        </select>
        <button class="btn" id="kodakNext" aria-label="Next Kodak image">›</button>
      </div>

      <button class="btn btn-primary" id="startBtn" disabled>Train</button>
      <label class="loop-toggle" title="When a run finishes, start again from iteration 0. Stop ends the loop.">
        <input type="checkbox" id="loopToggle" /> Loop
      </label>
      <button class="btn" id="stopBtn" disabled>Stop</button>

      <div class="spacer"></div>

      <button class="btn" id="toggleParamsBtn">Advanced</button>

      <div class="save-menu">
        <button class="btn" id="saveBtn" disabled>Save as…</button>
        <div class="save-popover hidden" id="savePopover">
          <button class="save-opt" id="savePng">PNG image</button>
          <button class="save-opt" id="saveTxt">sites.txt</button>
        </div>
      </div>

      <span class="status-chip" id="status">Loading…</span>
    </div>

    <div class="main">
      <aside class="panel hidden" id="paramsPanel">
        <h3>Input</h3>
        <div class="row">
          <label>mask</label>
          <div class="file-inline">
            <label class="file-btn"><input id="maskInput" type="file" accept="image/*" />Load</label>
            <span class="file-name" id="maskLabel">none</span>
          </div>
        </div>
        <div class="row">
          <label>init sites</label>
          <div class="file-inline">
            <label class="file-btn"><input id="initSitesInput" type="file" accept=".txt" />Load</label>
            <span class="file-name" id="initLabel">gradient init</span>
          </div>
        </div>

        <h3>Sites &amp; iterations</h3>
        <div class="row"><label>warmup iters</label><input id="p-warmupIters" type="number" /></div>
        <div class="row"><label>decay iters</label><input id="p-decayIters" type="number" /></div>
        <div class="row"><label>sites</label><input id="p-sites" type="number" /></div>
        <div class="row"><label>log-freq</label><input id="p-logFreq" type="number" /></div>
        <div class="row"><label>viewer-freq</label><input id="p-viewerFreq" type="number" /></div>

        <h3>Candidates</h3>
        <div class="row"><label>freq</label><input id="p-candFreq" type="number" /></div>
        <div class="row"><label>passes</label><input id="p-candUpdatePasses" type="number" /></div>
        <div class="row"><label>downscale</label><input id="p-candDownscale" type="number" /></div>
        <div class="row"><label>radius scale</label><input id="p-candRadiusScale" type="number" step="1" /></div>
        <div class="row"><label>radius probes</label><input id="p-candRadiusProbes" type="number" /></div>
        <div class="row"><label>inject count</label><input id="p-candInjectCount" type="number" /></div>
        <div class="row"><label>hilbert window</label><input id="p-candHilbertWindow" type="number" /></div>
        <div class="row"><label>hilbert probes</label><input id="p-candHilbertProbes" type="number" /></div>

        <h3>Color</h3>
        <div class="row"><label>space</label><select id="p-colorSpace" aria-label="Site color space"></select></div>

        <h3>Learning rates</h3>
        <div class="row"><label>LR mult</label><input id="p-lrMult" type="number" step="0.1" /></div>
        <div class="row"><label>pos</label><input id="p-lrPosBase" type="number" step="0.001" /></div>
        <div class="row"><label>tau</label><input id="p-lrTauBase" type="number" step="0.001" /></div>
        <div class="row"><label>radius</label><input id="p-lrRadiusBase" type="number" step="0.001" /></div>
        <div class="row"><label>color</label><input id="p-lrColorBase" type="number" step="0.001" /></div>
        <div class="row"><label>dir</label><input id="p-lrDirBase" type="number" step="0.001" /></div>
        <div class="row"><label>aniso</label><input id="p-lrAnisoBase" type="number" step="0.001" /></div>

        <h3>Site growth</h3>
        <div class="row" title="Rate-distortion slope: squared error (8-bit levels², RGB) a site must remove per bit it costs. 0 = fixed site count; otherwise 'sites' is the cap."><label>λ (0 = off)</label><input id="p-growLambda" type="number" step="10" /></div>
        <div class="row"><label>start sites</label><input id="p-growInitSites" type="number" /></div>
        <div class="row"><label>every iters</label><input id="p-growEvery" type="number" /></div>
        <div class="row"><label>end iter</label><input id="p-growEndIter" type="number" placeholder="60% of iters" /></div>
        <div class="row" title="Blur the fit target to sigma = this × site spacing while growing (0 = off)."><label>blur × spacing</label><input id="p-growBlur" type="number" step="0.05" /></div>
      </aside>

      <section class="view">
        <div class="view-toolbar">
          <span style="color:var(--text-dim)">layout</span>
          <select id="layoutSelect" aria-label="Viewer layout"></select>
          <button class="btn" id="editLayoutBtn">Edit layout</button>
          <span class="layout-edit-tools hidden" id="layoutEditTools">
            <button class="btn" id="addRowBtn">+ Row</button>
            <button class="btn" id="removeRowBtn" title="Removes the last row (must be empty)">− Row</button>
            <button class="btn" id="addColBtn">+ Column</button>
            <button class="btn" id="removeColBtn" title="Removes the last column (must be empty)">− Column</button>
          </span>
          <div class="metric-row" id="metricRow"></div>
        </div>

        <div class="canvases" id="canvases"></div>

        <div class="footer">
          <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text" id="progressText">Idle</div>
          <div class="log" id="logPanel"></div>
        </div>
      </section>
    </div>

    <script type="module" src="train.js?v=noflow-20261017"></script>
  </body>
</html>
